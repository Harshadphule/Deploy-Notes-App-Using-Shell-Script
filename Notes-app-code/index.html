<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Notes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>📝 Simple Notes</h1>
      <button id="addBtn" class="btn primary">+ New Note</button>
    </header>

    <main>
      <div id="emptyState" class="empty-state">
        <p>No notes yet. Click <strong>"+ New Note"</strong> to create one.</p>
      </div>
      <div id="notesGrid" class="notes-grid"></div>
    </main>
  </div>

  <!-- Note editor modal -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <input id="noteTitle" class="note-title-input" placeholder="Title" maxlength="80" />
      <textarea id="noteBody" class="note-body-input" placeholder="Write your note here..."></textarea>
      <div class="modal-actions">
        <button id="deleteBtn" class="btn danger">Delete</button>
        <div class="modal-actions-right">
          <button id="cancelBtn" class="btn">Cancel</button>
          <button id="saveBtn" class="btn primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
